# AI Community 开发环境数据库
# 使用：docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-community-dev-postgres
    environment:
      - POSTGRES_USER=aicom
      - POSTGRES_PASSWORD=aicom_dev
      - POSTGRES_DB=aicom
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicom"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
