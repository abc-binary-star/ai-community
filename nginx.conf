# ---- AI Community 生产环境 Nginx 配置 ----
# 对外统一入口：所有流量走 80/443 端口，Nginx 分发到前端和后端

upstream frontend {
  server web:3000;
}

upstream backend {
  server server:3001;
}

server {
  listen 80;
  server_name _;

  # 如果以后配 HTTPS，可在 443 块里加 ssl_certificate，这里先强制转发到 HTTPS
  # return 301 https://$host$request_uri;

  # gzip 压缩，减少传输体积
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # 静态资源长缓存（Next.js 的 _next/static 带 hash，可永久缓存）
  location ~ ^/(_next/static|images|assets)/ {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # 前端 API 请求代理到后端（关键！浏览器访问 /api/* 时由 Nginx 转至后端容器）
  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级头（为未来实时通知预留）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # 前端路由 history fallback（所有非 API 请求都由 Next.js 处理，支持 SPA 刷新不 404）
  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
