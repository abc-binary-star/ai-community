name: Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  # 前端镜像；与后端镜像并行构建，依赖层走 gha 缓存（package.json 不变时秒级命中）
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_URL }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          # 新版 buildx 默认附加 provenance/SBOM attestation（OCI 空清单），
          # 阿里云 ACR 不识别会被拒：unknown manifest class，故显式关闭
          provenance: false
          tags: ${{ secrets.ALIYUN_REGISTRY_URL }}/${{ secrets.ALIYUN_NAMESPACE }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # 后端镜像（server-go 目录自包含，context 指向它）
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY_URL }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server-go
          file: ./server-go/Dockerfile
          push: true
          provenance: false
          tags: ${{ secrets.ALIYUN_REGISTRY_URL }}/${{ secrets.ALIYUN_NAMESPACE }}/server:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # 镜像就绪后：nginx.conf / docker-compose.prod.yml / deploy.sh 是服务器本地文件
  # （前后端代码走镜像分发），用 scp 增量同步，再 SSH 执行 deploy.sh。
  # 不走 ECS 上 git pull GitHub——国内 ECS 访问 GitHub 常整体超时，
  # 旧方案三次重试实测耗掉 3 分半（deploy 全程 4 分钟），故彻底绕开。
  deploy:
    runs-on: ubuntu-latest
    needs: [build-web, build-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync config files to ECS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: "nginx.conf,docker-compose.prod.yml,deploy.sh"
          target: ${{ secrets.ECS_DEPLOY_PATH }}
          overwrite: true

      - name: Deploy to ECS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.ECS_DEPLOY_PATH }}
            chmod +x deploy.sh
            ./deploy.sh
