# ---- AI Community 生产环境部署编排 ----
# 使用：docker compose -f docker-compose.prod.yml up -d
# 前提：镜像已通过 GitHub Actions 推送到阿里云容器镜像服务
# 必填环境变量：REGISTRY_URL、REGISTRY_NAMESPACE（在 .env 中定义）
# 安全变量：JWT_SECRET、CORS_ORIGIN、DEEPSEEK_API_KEY
#
# 内存规划（适配 2G ECS，共约 1.6G 容器占用，剩余留给系统/swap）：
#   nginx 64M + web 512M + server 256M + postgres 768M
# 若 ECS 未开启 swap，建议在宿主机执行：
#   fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile

services:
  nginx:
    image: nginx:alpine
    container_name: ai-community-nginx
    mem_limit: 64m
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_started
    restart: unless-stopped

  web:
    image: ${REGISTRY_URL}/${REGISTRY_NAMESPACE}/web:latest
    container_name: ai-community-web
    mem_limit: 512m
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_TELEMETRY_DISABLED=1
      # 限制 Node 堆内存，防止占用超限触发 OOM
      - NODE_OPTIONS=--max-old-space-size=384
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started

  server:
    image: ${REGISTRY_URL}/${REGISTRY_NAMESPACE}/server:latest
    container_name: ai-community-server
    mem_limit: 256m
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://aicom:aicom_password@postgres:5432/aicom?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - VOLC_ASR_API_KEY=${VOLC_ASR_API_KEY:-}
      - VOLC_ASR_RESOURCE_ID=${VOLC_ASR_RESOURCE_ID:-volc.bigasr.sauc.duration}
      - AI_CONCURRENT_LIMIT=${AI_CONCURRENT_LIMIT:-5}
      - AI_DAILY_TOKEN_LIMIT=${AI_DAILY_TOKEN_LIMIT:-2000000}
      - AI_FREE_DAILY_TOKEN_LIMIT=${AI_FREE_DAILY_TOKEN_LIMIT:-100000}
      - AI_PRO_DAILY_TOKEN_LIMIT=${AI_PRO_DAILY_TOKEN_LIMIT:-500000}
      - AI_FREE_GLOBAL_TOKEN_POOL=${AI_FREE_GLOBAL_TOKEN_POOL:-700000}
      - AI_PRO_GLOBAL_TOKEN_POOL=${AI_PRO_GLOBAL_TOKEN_POOL:-1300000}
      - AI_FREE_REWRITE_MAX_CHARS=${AI_FREE_REWRITE_MAX_CHARS:-8000}
      - AI_PRO_REWRITE_MAX_CHARS=${AI_PRO_REWRITE_MAX_CHARS:-40000}
      - AI_FREE_TRANSCRIBE_MAX_SECONDS=${AI_FREE_TRANSCRIBE_MAX_SECONDS:-180}
      # 阿里云 OSS 对象存储（不配置则回退本地文件系统，容器重建会丢图，生产环境必须配置）
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-community-postgres
    mem_limit: 768m
    environment:
      - POSTGRES_USER=aicom
      - POSTGRES_PASSWORD=aicom_password
      - POSTGRES_DB=aicom
    # 收缩配置以适配 2G ECS：共享缓冲、连接数、排序/维护内存均收敛，
    # 避免慢查询 + 并发时吃掉整机内存被内核 OOM-kill
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=10min
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicom"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
