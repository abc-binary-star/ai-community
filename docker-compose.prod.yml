# ---- AI Community 生产环境部署编排 ----
# 使用：docker compose -f docker-compose.prod.yml up -d
# 前提：镜像已通过 GitHub Actions 推送到阿里云容器镜像服务
# 必填环境变量：REGISTRY_URL、REGISTRY_NAMESPACE（在 .env 中定义）
# 安全变量：JWT_SECRET、CORS_ORIGIN、DEEPSEEK_API_KEY

services:
  nginx:
    image: nginx:alpine
    container_name: ai-community-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_started
    restart: unless-stopped

  web:
    image: ${REGISTRY_URL}/${REGISTRY_NAMESPACE}/web:latest
    container_name: ai-community-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started

  server:
    image: ${REGISTRY_URL}/${REGISTRY_NAMESPACE}/server:latest
    container_name: ai-community-server
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://aicom:aicom_password@postgres:5432/aicom?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-community-postgres
    environment:
      - POSTGRES_USER=aicom
      - POSTGRES_PASSWORD=aicom_password
      - POSTGRES_DB=aicom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicom"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
