# 本地开发基础设施编排
# 启动：docker compose up -d  （或根目录 pnpm infra:up）
# 停止：docker compose down
# 数据持久化在各服务的 ./data 目录

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicom-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicom
      POSTGRES_PASSWORD: aicom_dev
      POSTGRES_DB: aicom
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicom"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    command: ["redis-server", "--appendonly", "yes"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aicom-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant/data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    container_name: aicom-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/aicom_dev
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
